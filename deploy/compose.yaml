name: argus-foundation

services:
  postgres:
    image: postgres:17.11@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    environment:
      POSTGRES_USER: argus_bootstrap_admin
      POSTGRES_DB: argus
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - fsync=on
      - -c
      - full_page_writes=on
      - -c
      - synchronous_commit=on
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=30
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - autovacuum_work_mem=32MB
      - -c
      - autovacuum_max_workers=2
      - -c
      - min_wal_size=80MB
      - -c
      - max_wal_size=512MB
      - -c
      - max_slot_wal_keep_size=256MB
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - statement_timeout=30s
    ports:
      - "127.0.0.1:5432:5432"
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "argus_bootstrap_admin", "-d", "argus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    shm_size: 128mb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:?Set POSTGRES_PASSWORD_SECRET_FILE to a protected password file outside the repository}

volumes:
  postgres_data:
